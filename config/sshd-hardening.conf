# Installed by sol (steps/40-ssh.sh). Edit config/sshd-hardening.conf instead:
# the next bootstrap run puts this file back.
#
# sshd keeps the FIRST value it reads for each keyword, and Debian's sshd_config
# includes sshd_config.d/*.conf at the very top. So this file beats the main
# config, and the 00- prefix beats the other drop-ins.

PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers @SOL_USER@

MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no

# Drop dead sessions after two minutes instead of leaving them hanging on flaky Wi-Fi.
ClientAliveInterval 30
ClientAliveCountMax 4

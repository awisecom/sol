#!/usr/sbin/nft -f
# Installed by sol (steps/50-firewall.sh). Edit config/nftables.conf instead.
#
# Only the "sol" table is replaced on reload. No `flush ruleset` on purpose:
# that would also wipe the chains tailscaled installs, and they only come back
# when tailscaled restarts.

table inet sol
delete table inet sol

table inet sol {
	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		meta l4proto ipv6-icmp accept comment "IPv6 needs ICMPv6: neighbour discovery, router adverts"
		icmp type { echo-request, destination-unreachable, time-exceeded } accept

		iifname { "tailscale0", "usb0" } tcp dport 22 accept comment "SSH from the tailnet and the USB cable"
		@SOL_NFT_LAN_SSH@

		udp dport 5353 accept comment "mDNS, so sol.local resolves on the LAN"
		udp dport 41641 accept comment "tailscale direct connections (the relay works without it)"
		iifname "usb0" udp dport { 53, 67 } accept comment "DHCP and DNS for the laptop on the USB cable"

		limit rate 5/minute log prefix "sol-drop: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}

// Installed by sol (steps/30-updates.sh). Edit config/apt-unattended.conf instead.
//
// Debian's 50unattended-upgrades already lists its own origins (security and
// point releases). The Raspberry Pi archive is not in that list and stays out:
// kernel, firmware and bootloader updates are done by hand.

APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";

Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";

// No surprise reboots: this box runs long tmux sessions. pi-doctor reports
// when a reboot is pending.
Unattended-Upgrade::Automatic-Reboot "@SOL_AUTO_REBOOT@";
Unattended-Upgrade::Automatic-Reboot-Time "04:30";

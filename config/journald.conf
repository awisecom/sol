# Installed by sol (steps/80-sd-wear.sh).
# volatile: the journal lives in RAM (/run/log/journal) and is gone after a reboot.
# Picked automatically when / is on an SD card; persistent when booting from USB or NVMe.
[Journal]
Storage=@SOL_JOURNAL_STORAGE@
RuntimeMaxUse=64M
SystemMaxUse=256M
MaxRetentionSec=1month
